name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create dummy local.properties
        run: echo "NONA_API_KEY=dummy_key_for_ci" > local.properties

      - name: Run Tests & Coverage
        run: ./gradlew :sharedLogic:jacocoTestReport :sharedLogic:jacocoTestCoverageVerification

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: sharedLogic/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: ./gradlew publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Maven Central
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: KMMBridge Publish (iOS SPM)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: ./gradlew :sharedLogic:kmmBridgePublish -PENABLE_PUBLISHING=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Project Version
        id: get_version
        run: |
          VERSION=$(grep -E 'version\s*=\s*"[^"]+"' sharedLogic/build.gradle.kts | head -n 1 | cut -d '"' -f 2)
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted project version: $VERSION"

      - name: Commit & Push Package.swift and Update Version Tags
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          if git diff --staged --quiet; then
            echo "No changes in Package.swift to commit."
          else
            TAG_NAME="${PROJECT_VERSION}"
            git commit -m "Update Package.swift for ${TAG_NAME} [skip ci]"
            
            # 1. Sync updated Package.swift to main branch
            git push origin HEAD:main
            
            # 2. Automatically create and force-update release tag for SPM (e.g. 1.0.5)
            git tag -f "${TAG_NAME}"
            git push origin -f "${TAG_NAME}"
          fi
